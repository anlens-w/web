<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>原神祈愿模拟器 · 7.1版本</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --gold: #d3bc8e;
    --gold-l: #ffe6b0;
    --r5: #ffb13f;
    --r4: #b57ef5;
    --r3: #6ba7e0;
  }

  body {
    min-height: 100vh;
    font-family: "HarmonyOS Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #080b12;
    background-image:
      radial-gradient(ellipse 80% 50% at 50% -10%, #2a3f5f 0%, transparent 70%),
      radial-gradient(ellipse 60% 45% at 50% 110%, #1a2740 0%, transparent 70%);
    background-attachment: fixed;
    color: #e8e0d0;
    display: flex;
    justify-content: center;
    padding: 28px 16px 56px;
    -webkit-tap-highlight-color: transparent;
  }

  .wrap { width: 100%; max-width: 800px; }

  header { text-align: center; margin-bottom: 20px; }

  header h1 {
    font-size: 28px;
    letter-spacing: 10px;
    font-weight: 600;
    color: var(--gold-l);
    text-shadow: 0 0 22px rgba(211, 188, 142, .55);
    margin-bottom: 8px;
  }

  header .sub {
    font-size: 12px;
    color: #8d9aad;
    letter-spacing: 3px;
  }

  .banner {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    padding: 12px 18px;
    border-radius: 10px;
    background: linear-gradient(90deg, rgba(107, 74, 24, .32), rgba(60, 40, 90, .28));
    border: 1px solid rgba(211, 188, 142, .22);
    margin-bottom: 16px;
  }

  .b-item { display: flex; align-items: center; gap: 8px; }

  .b-tag {
    font-size: 10px;
    padding: 3px 8px;
    border-radius: 4px;
    font-weight: 700;
    letter-spacing: 1px;
    white-space: nowrap;
  }

  .b-tag.gold {
    background: linear-gradient(135deg, #ff9c2b, #ffd166);
    color: #3a2400;
  }

  .b-tag.purple {
    background: linear-gradient(135deg, #8b4fd4, #c39bf5);
    color: #1d1030;
  }

  .b-name { font-size: 14px; color: #ecdfc4; letter-spacing: 1px; }
  .b-name.small { font-size: 12.5px; color: #c4b8d8; }

  .stage {
    position: relative;
    min-height: 340px;
    padding: 22px;
    border-radius: 14px;
    background: rgba(255, 255, 255, .025);
    border: 1px solid rgba(211, 188, 142, .15);
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    align-content: center;
    justify-content: center;
    perspective: 900px;
    margin-bottom: 14px;
    overflow: hidden;
  }

  .stage::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 45%, rgba(211, 188, 142, .08), transparent 65%);
    pointer-events: none;
  }

  .stage .hint {
    color: #5c6a7d;
    font-size: 14px;
    letter-spacing: 3px;
  }

  .card {
    position: relative;
    width: 88px;
    height: 136px;
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    padding: 8px 4px 11px;
    overflow: hidden;
    background: linear-gradient(170deg, #2b3a52, #141d2b);
    border: 1px solid rgba(255, 255, 255, .12);
    box-shadow: 0 4px 14px rgba(0, 0, 0, .5);
    animation: cardIn .55s cubic-bezier(.22, 1.2, .4, 1) backwards;
    user-select: none;
  }

  @keyframes cardIn {
    0%   { opacity: 0; transform: translateY(20px) scale(.7) rotateY(80deg); }
    100% { opacity: 1; transform: translateY(0) scale(1) rotateY(0); }
  }

  .card-name {
    font-size: 12px;
    font-weight: 600;
    line-height: 1.25;
    text-align: center;
    z-index: 2;
    margin-bottom: 7px;
    text-shadow: 0 1px 3px rgba(0, 0, 0, .9);
    word-break: break-all;
  }

  .card-star {
    font-size: 9px;
    letter-spacing: 1px;
    z-index: 2;
  }

  .card.r3 {
    background: linear-gradient(170deg, #2d4666, #121b28);
    border-color: rgba(107, 167, 224, .35);
  }
  .card.r3 .card-star { color: #6ba7e0; }

  .card.r4 {
    background: linear-gradient(170deg, #4a2f6e, #1b1128);
    border-color: rgba(181, 126, 245, .5);
    box-shadow: 0 0 14px rgba(162, 86, 225, .35), 0 4px 14px rgba(0, 0, 0, .5);
  }
  .card.r4 .card-star { color: #b57ef5; }

  .card.r5 {
    background: linear-gradient(170deg, #6b4a18, #291b07);
    border-color: rgba(255, 200, 100, .75);
    box-shadow: 0 0 18px rgba(255, 177, 63, .6), 0 4px 14px rgba(0, 0, 0, .5);
  }
  .card.r5 .card-star { color: #ffd77a; }

  .card.r5::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 8px;
    box-shadow: inset 0 0 26px rgba(255, 177, 63, .35);
    animation: pulse 1.5s ease-in-out infinite;
    pointer-events: none;
  }

  @keyframes pulse {
    0%, 100% { opacity: .45; }
    50%      { opacity: 1; }
  }

  .up-tag {
    position: absolute;
    top: 0;
    right: 0;
    z-index: 3;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: .5px;
    padding: 2px 6px;
    border-radius: 0 8px 0 8px;
    background: linear-gradient(135deg, #ff9c2b, #ffd166);
    color: #3a2400;
  }

  .std-tag {
    position: absolute;
    top: 0;
    right: 0;
    z-index: 3;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: .5px;
    padding: 2px 6px;
    border-radius: 0 8px 0 8px;
    background: linear-gradient(135deg, #5a6a80, #8a9bb5);
    color: #0d1420;
  }

  .guarantee {
    text-align: center;
    font-size: 12.5px;
    letter-spacing: 1px;
    color: #8d9aad;
    padding: 9px;
    border-radius: 8px;
    background: rgba(255, 255, 255, .025);
    border: 1px solid rgba(211, 188, 142, .12);
    margin-bottom: 14px;
    transition: .3s;
  }

  .guarantee.big {
    color: #ffd77a;
    border-color: rgba(255, 177, 63, .5);
    background: rgba(255, 177, 63, .08);
    box-shadow: 0 0 16px rgba(255, 177, 63, .2) inset;
  }

  .stats {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    gap: 8px;
    margin-bottom: 20px;
  }

  .stat {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding: 9px 4px;
    border-radius: 8px;
    background: rgba(255, 255, 255, .03);
    border: 1px solid rgba(211, 188, 142, .12);
  }

  .stat .k { font-size: 11px; color: #7d8a9c; }
  .stat .v { font-size: 15px; font-weight: 700; color: #e8e0d0; }
  .stat .v.c5 { color: var(--r5); }
  .stat .v.c4 { color: var(--r4); }
  .stat .v.c3 { color: var(--r3); }
  .stat .v.up { color: #ffd77a; }
  .stat .v.std { color: #a0b4cc; }

  .actions {
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .btn {
    font-family: inherit;
    font-size: 15px;
    letter-spacing: 2px;
    padding: 12px 28px;
    border-radius: 999px;
    border: 1px solid rgba(211, 188, 142, .5);
    background: linear-gradient(180deg, #34445c, #1b2433);
    color: var(--gold-l);
    cursor: pointer;
    transition: .2s;
    box-shadow: 0 4px 14px rgba(0, 0, 0, .4);
  }

  .btn:hover:not(:disabled) {
    border-color: var(--gold-l);
    box-shadow: 0 0 18px rgba(211, 188, 142, .45);
    transform: translateY(-2px);
  }

  .btn:active:not(:disabled) { transform: translateY(0) scale(.97); }

  .btn:disabled { opacity: .4; cursor: not-allowed; }

  .btn.primary {
    background: linear-gradient(180deg, #6b5424, #3a2b0e);
    border-color: rgba(255, 215, 140, .7);
    color: #ffe6b0;
  }

  .btn.ghost {
    background: transparent;
    color: #7d8a9c;
    border-color: rgba(125, 138, 156, .35);
  }

  .flash {
    position: fixed;
    inset: 0;
    z-index: 999;
    pointer-events: none;
    background: radial-gradient(circle at 50% 45%, rgba(255, 220, 150, .55), rgba(255, 177, 63, 0) 65%);
    animation: flashOut .9s ease-out forwards;
  }

  @keyframes flashOut {
    0%   { opacity: 0; }
    18%  { opacity: 1; }
    100% { opacity: 0; }
  }

  .footnote {
    margin-top: 22px;
    text-align: center;
    font-size: 11px;
    line-height: 1.7;
    color: #4e5a6b;
  }

  @media (max-width: 640px) {
    .stats { grid-template-columns: repeat(4, 1fr); }
  }

  @media (max-width: 480px) {
    header h1 { font-size: 22px; letter-spacing: 6px; }
    .stage { padding: 14px; gap: 8px; min-height: 300px; }
    .card { width: 72px; height: 114px; }
    .card-name { font-size: 10px; margin-bottom: 5px; }
    .card-star { font-size: 8px; }
    .btn { padding: 11px 20px; font-size: 14px; letter-spacing: 1px; }
    .stats { grid-template-columns: repeat(4, 1fr); }
    .stat .v { font-size: 13px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>祈 愿</h1>
    <p class="sub">7.1版本 · 往冥府的安魂歌</p>
  </header>

  <div class="banner">
    <div class="b-item">
      <span class="b-tag gold">五星 UP</span>
      <span class="b-name">薇斯纳 · 沃雅妮莎</span>
    </div>
    <div class="b-item">
      <span class="b-tag purple">四星 UP</span>
      <span class="b-name small">迪奥娜 · 重云 · 珐露珊</span>
    </div>
  </div>

  <div class="stage" id="stage">
    <p class="hint">点击下方按钮开始祈愿</p>
  </div>

  <div class="guarantee" id="guarantee">小保底 · 下次五星有 50% 概率为 UP 角色</div>

  <div class="stats">
    <div class="stat"><span class="k">总抽数</span><span class="v" id="s-total">0</span></div>
    <div class="stat"><span class="k">五星</span><span class="v c5" id="s-5">0</span></div>
    <div class="stat"><span class="k">五星UP</span><span class="v up" id="s-5up">0</span></div>
    <div class="stat"><span class="k">五星常驻</span><span class="v std" id="s-5std">0</span></div>
    <div class="stat"><span class="k">四星</span><span class="v c4" id="s-4">0</span></div>
    <div class="stat"><span class="k">三星</span><span class="v c3" id="s-3">0</span></div>
    <div class="stat"><span class="k">五星率</span><span class="v" id="s-rate">0.00%</span></div>
    <div class="stat"><span class="k">保底进度</span><span class="v" id="s-pity">0 / 90</span></div>
  </div>

  <div class="actions">
    <button class="btn" id="pull1">祈愿 ×1</button>
    <button class="btn primary" id="pull10">祈愿 ×10</button>
    <button class="btn ghost" id="reset">重置</button>
  </div>

  <p class="footnote">
    五星基础概率 0.6%（第 74 抽起递增，90 抽必出）· 四星基础概率 5.1%，10 抽保底<br>
    本页面仅供娱乐，与官方无关
  </p>

</div>

<script>
(function () {
  'use strict';

  /* ================= 卡池数据 · 7.1版本 ================= */
  const POOL = {
    r5up: ['薇斯纳', '沃雅妮莎'],
    r5std: ['琴', '迪卢克', '莫娜', '刻晴', '七七', '提纳里', '迪希雅', '梦见月瑞希'],
    r4up: ['迪奥娜', '重云', '珐露珊'],
    r4std: [
      '安柏', '凯亚', '丽莎', '香菱', '北斗', '行秋', '重云', '诺艾尔', '班尼特',
      '菲谢尔', '砂糖', '雷泽', '芭芭拉', '罗莎莉亚', '辛焱', '迪奥娜', '烟绯',
      '早柚', '云堇', '鹿野院平藏', '久岐忍', '多莉', '坎蒂丝', '莱依拉', '米卡',
      '绮良良', '卡维', '珐露珊',
      '祭礼剑', '笛剑', '匣里龙吟', '西风剑', '祭礼大剑', '雨裁', '钟剑',
      '西风大剑', '西风长枪', '匣里灭辰', '试作星镰', '弓藏', '绝弦',
      '西风猎弓', '祭礼弓', '祭礼残章', '流浪乐章', '西风秘典'
    ],
    r3: [
      '冷刃', '黎明神剑', '飞天御剑', '暗铁剑', '吃虎鱼刀', '旅行剑',
      '沐浴龙血的剑', '铁影阔剑', '白铁大剑', '石英大剑', '以理服人',
      '白缨枪', '黑缨枪', '翡玉法球', '讨龙英杰谭', '魔导绪论', '甲级宝珏',
      '鸦羽弓', '神射手之誓', '弹弓', '黑檀弓', '信使'
    ]
  };

  /* ================= 状态 ================= */
  const state = {
    total: 0,
    pity5: 0,
    pity4: 0,
    guarantee5: false,
    guarantee4: false,
    count5: 0,
    count5up: 0,    // 五星UP计数
    count5std: 0,   // 五星常驻计数
    count4: 0,
    count3: 0
  };

  let busy = false;

  const $ = id => document.getElementById(id);
  const stage = $('stage');

  /* ================= 抽卡核心 ================= */

  function rate5(pity) {
    if (pity >= 90) return 1;
    if (pity <= 73) return 0.006;
    return Math.min(1, 0.006 + 0.06 * (pity - 73));
  }

  const pick = arr => arr[Math.floor(Math.random() * arr.length)];

  function pullOne() {
    state.total++;
    state.pity5++;
    state.pity4++;

    /* --- 五星判定 --- */
    if (Math.random() < rate5(state.pity5)) {
      state.pity5 = 0;
      state.count5++;

      let name, isUp = false;
      if (state.guarantee5 || Math.random() < 0.5) {
        name = pick(POOL.r5up);
        state.guarantee5 = false;
        isUp = true;
        state.count5up++;
      } else {
        name = pick(POOL.r5std);
        state.guarantee5 = true;
        state.count5std++;
      }
      return { name, rarity: 5, isUp };
    }

    /* --- 四星判定 --- */
    const p4 = state.pity4 >= 10 ? 1 : 0.051;
    if (Math.random() < p4) {
      state.pity4 = 0;
      state.count4++;

      let name, isUp = false;
      if (state.guarantee4 || Math.random() < 0.5) {
        name = pick(POOL.r4up);
        state.guarantee4 = false;
        isUp = true;
      } else {
        name = pick(POOL.r4std);
        state.guarantee4 = true;
      }
      return { name, rarity: 4, isUp };
    }

    /* --- 三星 --- */
    state.count3++;
    return { name: pick(POOL.r3), rarity: 3, isUp: false };
  }

  /* ================= 渲染 ================= */

  function render(results) {
    stage.innerHTML = '';
    const frag = document.createDocumentFragment();

    results.forEach((item, i) => {
      const card = document.createElement('div');
      card.className = 'card r' + item.rarity;
      card.style.animationDelay = (i * 0.08) + 's';

      let tag = '';
      if (item.rarity === 5 && item.isUp) tag = '<span class="up-tag">UP</span>';
      if (item.rarity === 5 && !item.isUp) tag = '<span class="std-tag">常驻</span>';

      card.innerHTML =
        tag +
        '<span class="card-name">' + item.name + '</span>' +
        '<span class="card-star">' + '★'.repeat(item.rarity) + '</span>';
      frag.appendChild(card);
    });

    stage.appendChild(frag);
  }

  function updateStats() {
    $('s-total').textContent = state.total;
    $('s-5').textContent = state.count5;
    $('s-5up').textContent = state.count5up;
    $('s-5std').textContent = state.count5std;
    $('s-4').textContent = state.count4;
    $('s-3').textContent = state.count3;
    $('s-rate').textContent =
      (state.total ? (state.count5 / state.total * 100) : 0).toFixed(2) + '%';
    $('s-pity').textContent = state.pity5 + ' / 90';

    const g = $('guarantee');
    if (state.guarantee5) {
      g.textContent = '大保底 · 下次五星必定为 UP 角色';
      g.classList.add('big');
    } else {
      g.textContent = '小保底 · 下次五星有 50% 概率为 UP 角色';
      g.classList.remove('big');
    }
  }

  function flash() {
    const el = document.createElement('div');
    el.className = 'flash';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 900);
  }

  function setBusy(b) {
    busy = b;
    ['pull1', 'pull10', 'reset'].forEach(id => { $(id).disabled = b; });
  }

  /* ================= 交互 ================= */

  function doPull(n) {
    if (busy) return;
    setBusy(true);

    const results = [];
    for (let i = 0; i < n; i++) results.push(pullOne());

    render(results);
    updateStats();

    if (results.some(r => r.rarity === 5)) flash();

    setTimeout(() => setBusy(false), n * 80 + 450);
  }

  function reset() {
    if (busy) return;
    if (!confirm('确定要清空所有抽卡记录吗？')) return;

    state.total = 0;
    state.pity5 = 0;
    state.pity4 = 0;
    state.guarantee5 = false;
    state.guarantee4 = false;
    state.count5 = 0;
    state.count5up = 0;
    state.count5std = 0;
    state.count4 = 0;
    state.count3 = 0;

    stage.innerHTML = '<p class="hint">点击下方按钮开始祈愿</p>';
    updateStats();
  }

  $('pull1').addEventListener('click', () => doPull(1));
  $('pull10').addEventListener('click', () => doPull(10));
  $('reset').addEventListener('click', reset);

  updateStats();
})();
</script>
</body>
</html>
